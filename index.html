<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="bitgame-mods GAME MODE: Claude Code 모드 21종을 쉬운 한국어로 설명하는 발표">
<meta property="og:title" content="GAME MODE 발표">
<meta property="og:description" content="Claude Code를 8비트 게임처럼. 화면의 모든 요소가 실제로 일을 합니다.">
<title>GAME MODE 발표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
@font-face{font-family:"Galmuri11";src:url(fonts/Galmuri11-Bold.woff2) format("woff2");font-weight:400 700;font-display:swap}
/* Layout: one slide at a time, NES-style message windows on a night-blue screen, a fixed control bar at the bottom. Deliberately single dark theme (it is a game screen). */
:root{
  --bg:#0a0c22;--panel:#131942;--line:#2b3378;--fg:#eef0ff;--muted:#a9b0dc;
  --win:#22277c;--winline:#a3abff;--wintext:#f4f5ff;--winmuted:#b9bfee;
  --y:#f8d830;--g:#58d854;--c:#3cbcfc;--o:#fca044;--r:#ff6b6b;
  --p1:var(--o);--p2:var(--c);--p3:var(--g);
  --pixel:"Galmuri11","IBM Plex Mono",ui-monospace,monospace;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --bar:64px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.65;margin:0;word-break:keep-all;overflow-wrap:anywhere;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px);background-size:100% 4px}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.deck{padding-inline:clamp(16px,4vw,48px);padding-block:24px calc(var(--bar) + 32px + env(safe-area-inset-bottom,0px))}
.slide{display:none;max-width:1080px;margin-inline:auto;min-height:calc(100dvh - var(--bar) - 56px);flex-direction:column;justify-content:center;gap:24px}
.slide.active{display:flex}
@media (prefers-reduced-motion:no-preference){.slide.active{animation:enter .35s steps(6,end)}}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* type */
.eyebrow{font-family:var(--pixel);font-size:13px;letter-spacing:.08em;color:var(--muted);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
.display{font-family:var(--pixel);font-size:clamp(44px,9vw,96px);line-height:1;letter-spacing:.02em;color:var(--y);text-shadow:4px 4px 0 #b4401c}
h2{font-family:var(--pixel);font-size:clamp(28px,4.4vw,44px);line-height:1.2}
h2 .en{font-size:.45em;color:var(--muted);margin-left:10px;letter-spacing:.04em}
.lead{font-size:clamp(18px,2.2vw,22px);max-width:62ch;color:var(--fg);margin:0}
.sub{color:var(--muted);margin:0;max-width:65ch}
p{margin:0}

/* chips */
.chip{font-family:var(--pixel);font-size:12px;padding:3px 8px;border:2px solid currentColor;line-height:1.3;white-space:nowrap}
.chip.p1{color:var(--p1)}.chip.p2{color:var(--p2)}.chip.p3{color:var(--p3)}

/* NES message window */
.win{background:var(--win);color:var(--wintext);border:3px solid var(--winline);box-shadow:0 0 0 3px var(--win),0 0 0 6px var(--bg),6px 6px 0 6px rgba(0,0,0,.45);padding:18px 20px;font-family:var(--pixel);font-size:clamp(14px,1.7vw,17px);line-height:1.8;min-width:0;overflow-x:auto}
.win .cap{font-size:12px;color:var(--winmuted);letter-spacing:.06em;margin-bottom:8px;display:block}
.win .ln{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.t-y{color:var(--y)}.t-g{color:var(--g)}.t-c{color:var(--c)}.t-o{color:var(--o)}.t-r{color:var(--r)}.t-m{color:var(--winmuted)}.t-w{color:var(--wintext)}
.t-u{color:var(--o);text-decoration:underline wavy var(--o);text-underline-offset:5px}
.blink{animation:none}
@media (prefers-reduced-motion:no-preference){.blink{animation:blink 1s steps(1) infinite}}
@keyframes blink{50%{opacity:0}}

/* buttons */
.actions{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--pixel);font-size:15px;padding:11px 16px;border:3px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer;text-decoration:none;box-shadow:4px 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:hover{background:var(--panel)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.btn.primary{background:var(--y);color:#1a1300;border-color:var(--y);box-shadow:4px 4px 0 #b4401c}
.btn.primary:hover{background:#ffe766}
.btn .k{font-size:11px;opacity:.75;border:1px solid currentColor;padding:0 4px}

/* title */
.hero-img{width:100%;max-width:100%;image-rendering:pixelated;border:3px solid var(--line);display:block}
.kernel{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,9rem),1fr));gap:12px}
.stat{border:2px solid var(--line);background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--pixel);font-size:20px;font-weight:700}
.stat span{color:var(--muted);font-size:14px}

/* cards grid */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:16px}
.card{border:2px solid var(--line);background:var(--panel);padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-family:var(--pixel);font-size:19px;color:var(--y)}
.card p{color:var(--fg);font-size:15px}
.card .ex{font-family:var(--mono);font-size:13px;color:var(--muted)}

/* phase map */
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:16px}
.phase{border:3px solid currentColor;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--panel);min-width:0}
.phase.p1{color:var(--p1)}.phase.p2{color:var(--p2)}.phase.p3{color:var(--p3)}
.phase h3{font-family:var(--pixel);font-size:20px}
.phase p{color:var(--fg);font-size:15px}
.modlist{display:flex;flex-wrap:wrap;gap:8px}
.modbtn{font-family:var(--pixel);font-size:14px;padding:6px 10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;display:inline-flex;gap:6px;align-items:baseline}
.modbtn:hover{border-color:currentColor;background:var(--line)}
.modbtn small{color:var(--muted);font-size:11px}

/* mod slide */
.modhead{display:flex;flex-direction:column;gap:10px}
.modbody{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.modbody{grid-template-columns:minmax(0,1fr)}}
.explain{display:flex;flex-direction:column;gap:16px}
.explain .row{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:12px;align-items:baseline;border-top:2px dashed var(--line);padding-top:12px}
.explain .row:first-child{border-top:0;padding-top:0}
.explain .lbl{font-family:var(--pixel);font-size:14px;color:var(--y)}
@media (max-width:480px){.explain .row{grid-template-columns:minmax(0,1fr);gap:4px}}
.cmd{font-family:var(--mono);font-size:14px;color:var(--c)}
.progress-dots{display:flex;gap:4px;flex-wrap:wrap}
.progress-dots i{width:10px;height:10px;background:var(--line)}
.progress-dots i.on{background:currentColor}
.progress-dots i.done{background:currentColor;opacity:.4}

/* numbers */
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr));gap:14px}
.num{border:2px solid var(--line);background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.num b{font-family:var(--pixel);font-size:34px;color:var(--y);font-variant-numeric:tabular-nums;line-height:1.1}
.num .nm{font-family:var(--pixel);font-size:14px;color:var(--fg)}
.num p{font-size:14px;color:var(--muted)}
.callout{border:3px solid var(--o);padding:16px 18px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.callout b{color:var(--o);font-family:var(--pixel)}

/* lists */
.road{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.road li{display:grid;grid-template-columns:2.2rem 8rem minmax(0,1fr);gap:12px;align-items:baseline;border-bottom:2px dashed var(--line);padding-bottom:10px}
.road .n{font-family:var(--pixel);color:var(--muted)}
.road .a{font-family:var(--pixel);font-size:14px;color:var(--c)}
@media (max-width:560px){.road li{grid-template-columns:2rem minmax(0,1fr)}.road .a{grid-column:2}.road .d{grid-column:2}}

/* video */
.video{width:100%;max-width:100%;border:3px solid var(--line);background:#000;display:block;aspect-ratio:150/92}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:18px}
.q{border:2px solid var(--line);background:var(--panel);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.q h3{font-size:17px;font-weight:500}
.q h3 span{font-family:var(--pixel);color:var(--y);margin-right:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);background:var(--bg);padding:8px 12px;cursor:pointer;text-align:left;font-size:15px}
.opt:hover{border-color:var(--fg)}
.opt.right{border-color:var(--g);color:var(--g)}
.opt.wrong{border-color:var(--r);color:var(--r)}
.fb{font-size:14px;color:var(--muted);min-height:1.4em}
.score{font-family:var(--pixel);font-size:18px;color:var(--y)}

/* install */
.code{position:relative;background:#05061a;border:2px solid var(--line);padding:14px 16px;font-family:var(--mono);font-size:13px;line-height:1.7;color:var(--fg);overflow-x:auto;white-space:pre;margin:0}
.steps{display:flex;flex-direction:column;gap:18px}
.step{display:grid;grid-template-columns:3rem minmax(0,1fr);gap:14px}
.step .no{font-family:var(--pixel);font-size:24px;color:var(--y)}
.step h3{font-size:18px;margin-bottom:6px}
.step .body{display:flex;flex-direction:column;gap:8px;min-width:0}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#070818;border-top:3px solid var(--line);padding:10px clamp(12px,3vw,32px) calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px}
.bar .nav{font-family:var(--pixel);font-size:14px;padding:8px 12px;border:2px solid var(--fg);background:transparent;cursor:pointer;white-space:nowrap}
.bar .nav:hover{background:var(--panel)}
.bar .nav[disabled]{opacity:.35;cursor:default}
.bar .nav.next{background:var(--y);color:#1a1300;border-color:var(--y)}
.track{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.track .info{display:flex;justify-content:space-between;gap:8px;font-family:var(--pixel);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.track .info span:first-child{overflow:hidden;text-overflow:ellipsis}
.track .rail{height:8px;background:var(--line);position:relative}
.track .fill{position:absolute;inset:0 auto 0 0;background:var(--y);width:0}
@media (max-width:560px){.bar .hide-sm{display:none}}

/* overlays */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(5,6,20,.92);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px}
.overlay[hidden]{display:none!important}
.sheet{width:100%;max-width:1000px;display:flex;flex-direction:column;gap:18px}
.sheet .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,14rem),1fr));gap:8px}
.toc button{text-align:left;border:2px solid var(--line);background:var(--panel);padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:baseline;min-width:0}
.toc button:hover,.toc button.cur{border-color:var(--y)}
.toc .i{font-family:var(--pixel);font-size:12px;color:var(--muted);flex:none;width:2rem}
.toc .tt{font-size:14px;overflow:hidden;text-overflow:ellipsis}
.toc .p1{color:var(--p1)}.toc .p2{color:var(--p2)}.toc .p3{color:var(--p3)}
.shot{max-width:100%;border:3px solid var(--winline);display:block;margin-inline:auto}
.toast{position:fixed;left:50%;bottom:calc(var(--bar) + 24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--g);color:#052000;font-family:var(--pixel);font-size:14px;padding:10px 16px;border:3px solid #052000;box-shadow:4px 4px 0 #000;max-width:calc(100% - 32px)}
.toast[hidden]{display:none!important}
.fallback{width:100%;min-height:8rem;font-family:var(--mono);font-size:13px;background:#05061a;color:var(--fg);border:2px solid var(--line);padding:10px}
</style>
</head>
<body>


<main class="deck" id="deck" aria-live="polite"></main>

<nav class="bar" aria-label="슬라이드 이동">
  <button class="nav" id="prev" type="button" aria-label="이전 슬라이드">◀<span class="hide-sm"> 이전</span></button>
  <div class="track">
    <div class="info"><span id="cur-title">GAME MODE</span><span id="counter">1 / 1</span></div>
    <div class="rail"><div class="fill" id="fill"></div></div>
  </div>
  <button class="nav" id="toc-open" type="button">목차</button>
  <button class="nav next" id="next" type="button" aria-label="다음 슬라이드"><span class="hide-sm">다음 </span>▶</button>
</nav>

<div class="overlay" id="toc" hidden role="dialog" aria-modal="true" aria-label="목차">
  <div class="sheet">
    <div class="top"><h2>목차</h2><button class="btn" id="toc-close" type="button">닫기 <span class="k">ESC</span></button></div>
    <div class="toc" id="toc-list"></div>
  </div>
</div>

<div class="overlay" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="실제 화면">
  <div class="sheet">
    <div class="top"><p class="sub" id="lb-cap"></p><button class="btn" id="lb-close" type="button">닫기 <span class="k">ESC</span></button></div>
    <img class="shot" id="lb-img" alt="">
  </div>
</div>

<div class="overlay" id="copybox" hidden role="dialog" aria-modal="true" aria-label="명령 복사">
  <div class="sheet">
    <div class="top"><p class="sub">자동 복사가 막혀 있어요. 아래 글을 선택해서 직접 복사하세요.</p><button class="btn" id="cb-close" type="button">닫기 <span class="k">ESC</span></button></div>
    <textarea class="fallback" id="cb-text" readonly aria-label="복사할 명령"></textarea>
  </div>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<script>
(function(){
const REPO = 'https://github.com/Reasonofmoon/bitgame-mods';
const DASH = 'https://claude.ai/code/artifact/c305dc66-0dc5-4f9d-b2df-be95eefe9605';
const MARKET = 'claude plugin marketplace add Reasonofmoon/bitgame-mods';
const ALL = ['hud','battle-log','trap-guard','barrier','loop-breaker','save-point','earcons','stance','casting','clear-time','party','quest','minimap','hint','map','spell-check','answer-memory','hedge-mark','item-get','equip','achievement'];
const BASH_ALL = MARKET + '\nfor m in ' + ALL.join(' ') + '; do\n  claude plugin install "game-$m@bitgame-mods"\ndone';
const PS_ALL = MARKET + '\n' + ALL.map(m => '"' + m + '"').join(',') + ' |\n  ForEach-Object { claude plugin install "game-$_@bitgame-mods" }';

const SHOTS = {
  title: ['shots/shot-title.png', '시작 화면: 타이틀, HUD, EQUIP, MAP, STANCE 배지, 밑줄 그어진 ‘적당히’'],
  battle: ['shots/shot-battle.png', '첫 턴: P1 메시지 창, 완료 조건을 밝히는 CLAUDE 창, 전투 기록과 콤보, CASTING, 파티 창'],
  guards: ['shots/shot-guards.png', '가드: TRAP! · BARRIER! · COMBO ×14 → BREAK · LOOP!, 힌트 줄의 ‘오류부터 읽기’'],
  save: ['shots/shot-save.png', '/save: 세이브 화면, PASSWORD COPIED!, 첫 세이브 업적, HUD의 SAVED'],
  panes: ['shots/shot-panes.png', '다음 세션: 이어진 퀘스트 로그와 미니맵'],
  hedge: ['shots/shot-hedge.png', '추측 표시: 추측 문장마다 [?], 아래에 ‘추정 3곳’']
};

const PH = {
  p1: {name: 'P1 안전·비용', short: '안전·비용', line: '사고를 막고, 남은 기억·사용량·비용을 보여 줍니다.'},
  p2: {name: 'P2 흐름 파악', short: '흐름 파악', line: 'AI가 지금 무엇을 하는지, 어디까지 왔는지 보여 줍니다.'},
  p3: {name: 'P3 습관', short: '습관', line: '모호한 요청, 추측, 모델 선택 같은 습관을 바로잡아 줍니다.'}
};

// Each mod: what you see (lines of [text, color]), plain meaning, why, the game analogy.
const MODS = [
 {id:'hud',ko:'HUD 상태창',en:'HUD',ph:'p1',one:'남은 기억, 남은 사용량, 쓴 돈을 늘 보여 주는 상태창',
  scr:[[['LV 03  ','y'],['EXP █░░  ','g'],['HP ███ 96%  ','g'],['MP ███ 77% 5h  ','c'],['G ₩263','y']],[['READY ','g'],['준비 완료','m']],[['[ 휴식 /compact ]  [ 세이브 /save ]','w']]],
  mean:'입력창 바로 위에 뜨는 상태창입니다. HP는 AI가 이번 대화에서 더 담아 둘 수 있는 기억의 여유(컨텍스트), MP는 요금제 사용 한도의 남은 양, G는 이번 세션에 쓴 비용(원화)입니다.',
  why:'대화가 길어지면 AI는 앞 내용을 놓치기 시작합니다. HP가 25% 아래로 떨어지면 HP LOW!와 함께 휴식(/compact, 대화 요약)과 세이브(/save) 버튼을 띄웁니다.',
  game:'화면 구석의 체력·마나·돈 표시. 피가 바닥나기 전에 쉬라고 알려 주는 것과 같습니다.',cmd:'/hud hide · /hud show',shot:'title'},
 {id:'battle-log',ko:'전투 기록',en:'Battle Log',ph:'p1',one:'AI가 한 작업을 성공·실패·콤보로 보여 주는 기록',
  scr:[[['⚔ BATTLE LOG · TURN 2','y']],[['▸ WRITE src/auth.js ','w'],['+4 ','g'],['−4 ','r'],['CRIT ','o'],['COMBO ×3','c']],[['▸ BASH npm test ','w'],['MISS ','r'],['COMBO ×3 → BREAK','r']]],
  mean:'AI가 파일을 읽고, 고치고, 명령을 실행할 때마다 남는 기록을 전투 기록처럼 보여 줍니다. 성공이 이어지면 콤보, 실패하면 BREAK가 붙고, 파일을 고치면 늘어난 줄(+)과 줄어든 줄(−)을 표시합니다.',
  why:'수십 줄 기록 속에서 실패한 작업이 바로 눈에 띕니다. 무엇이 얼마나 바뀌었는지도 한 줄로 확인할 수 있습니다.',

const deck = document.getElementById('deck');
deck.innerHTML = slides.map((s, i) => `<section class="slide" id="s${i + 1}" data-i="${i}" aria-label="${esc(s.title)}">${s.html()}</section>`).join('');
const els = [...deck.querySelectorAll('.slide')];
const keyIndex = Object.fromEntries(slides.map((s, i) => [s.key, i]));

// TOC
const toc = document.getElementById('toc-list');
toc.innerHTML = slides.map((s, i) => `<button type="button" data-goto="${i}"><span class="i">${String(i + 1).padStart(2, '0')}</span><span class="tt ${s.phase || ''}">${s.mod !== undefined ? 'MOD ' + String(s.mod + 1).padStart(2, '0') + ' · ' : ''}${esc(s.title)}</span></button>`).join('');

let cur = 0;
function show(i, focus) {
  cur = Math.max(0, Math.min(slides.length - 1, i));
  els.forEach((el, k) => el.classList.toggle('active', k === cur));
  document.getElementById('counter').textContent = (cur + 1) + ' / ' + slides.length;
  document.getElementById('cur-title').textContent = slides[cur].title;
  document.getElementById('fill').style.width = ((cur + 1) / slides.length * 100) + '%';
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').disabled = cur === slides.length - 1;
  toc.querySelectorAll('button').forEach((b, k) => b.classList.toggle('cur', k === cur));
  try { history.replaceState(null, '', '#s' + (cur + 1)); } catch (e) {}
  window.scrollTo(0, 0);
  if (focus) { const h = els[cur].querySelector('h1,h2'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({preventScroll: true}); } }
}
const next = () => show(cur + 1, true), prev = () => show(cur - 1, true);
document.getElementById('next').addEventListener('click', next);
document.getElementById('prev').addEventListener('click', prev);

// overlays
const overlays = ['toc', 'lightbox', 'copybox'].map(id => document.getElementById(id));
const closeAll = () => overlays.forEach(o => o.hidden = true);
const anyOpen = () => overlays.some(o => !o.hidden);
document.getElementById('toc-open').addEventListener('click', () => { document.getElementById('toc').hidden = false; document.getElementById('toc-close').focus(); });
['toc-close', 'lb-close', 'cb-close'].forEach(id => document.getElementById(id).addEventListener('click', closeAll));
overlays.forEach(o => o.addEventListener('click', e => { if (e.target === o) closeAll(); }));

// toast + copy
let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }
function textFor(k) {
  if (k === 'all-bash') return BASH_ALL;
  if (k === 'all-ps') return PS_ALL;
  if (k.startsWith('mod:')) return MARKET + '\nclaude plugin install game-' + k.slice(4) + '@bitgame-mods';
  return '';
}
function copy(text, label) {
  const fallback = () => { const ta = document.getElementById('cb-text'); ta.value = text; document.getElementById('copybox').hidden = false; ta.focus(); ta.select(); };
  try {
    if (!navigator.clipboard) return fallback();
    navigator.clipboard.writeText(text).then(() => toast(label + ' 복사했어요. 터미널에 붙여 넣으세요.')).catch(fallback);
  } catch (e) { fallback(); }
}

// quiz state
const answered = {};
function score() { document.getElementById('score').textContent = Object.values(answered).filter(Boolean).length + ' / ' + QUIZ.length + (Object.keys(answered).length === QUIZ.length ? (Object.values(answered).every(Boolean) ? '  ★ ALL CLEAR!' : '  다시 풀어 보세요') : ''); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-mod],[data-goto],[data-shot],[data-copy],.opt,#quiz-reset');
  if (!t) return;
  if (t.dataset.go) {
    const g = t.dataset.go;
    if (g === 'next') next(); else if (g === 'first') show(0, true); else if (g in keyIndex) show(keyIndex[g], true);
  } else if (t.dataset.mod) { show(keyIndex[t.dataset.mod], true); }
  else if (t.dataset.goto) { closeAll(); show(Number(t.dataset.goto), true); }
  else if (t.dataset.shot) {
    const s = SHOTS[t.dataset.shot]; const img = document.getElementById('lb-img');
    img.src = s[0]; img.alt = s[1]; document.getElementById('lb-cap').textContent = s[1];
    document.getElementById('lightbox').hidden = false; document.getElementById('lb-close').focus();
  }
  else if (t.dataset.copy) { const k = t.dataset.copy; copy(textFor(k), k.startsWith('mod:') ? 'game-' + k.slice(4) + ' 설치 명령을' : '설치 명령을'); }
  else if (t.classList.contains('opt')) {
    const qi = Number(t.dataset.qi), oi = Number(t.dataset.oi), x = QUIZ[qi];
    if (qi in answered) return;
    answered[qi] = oi === x.a;
    const box = t.closest('.q');
    box.querySelectorAll('.opt').forEach((b, k) => { if (k === x.a) b.classList.add('right'); else if (k === oi) b.classList.add('wrong'); b.setAttribute('aria-disabled', 'true'); });
    document.getElementById('fb-' + qi).textContent = (answered[qi] ? '정답! ' : '아쉬워요. ') + x.why;
    score();
  }
  else if (t.id === 'quiz-reset') {
    Object.keys(answered).forEach(k => delete answered[k]);
    deck.querySelectorAll('.opt').forEach(b => { b.classList.remove('right', 'wrong'); b.removeAttribute('aria-disabled'); });
    QUIZ.forEach((_, i) => document.getElementById('fb-' + i).textContent = '');
    score();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (anyOpen()) { closeAll(); e.preventDefault(); } return; }
  if (anyOpen()) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'textarea' || tag === 'input' || tag === 'video') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { next(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { prev(); e.preventDefault(); }
  else if (e.key === 'Home') { show(0, true); e.preventDefault(); }
  else if (e.key === 'End') { show(slides.length - 1, true); e.preventDefault(); }
});

let tx = null, ty = null;
deck.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive: true});
deck.addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { dx < 0 ? next() : prev(); }
}, {passive: true});

const m = /^#s(\d+)$/.exec(location.hash);
show(m ? Number(m[1]) - 1 : 0, false);
})();
</script>
